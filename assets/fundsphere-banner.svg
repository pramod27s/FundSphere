<svg viewBox="0 0 1200 340" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050a14" />
      <stop offset="50%" stop-color="#0b1528" />
      <stop offset="100%" stop-color="#041e24" />
    </linearGradient>

    <radialGradient id="teal-glow" cx="20%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0d9488" stop-opacity="0.32" />
      <stop offset="60%" stop-color="#0d9488" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#0d9488" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="blue-glow" cx="85%" cy="30%" r="45%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.22" />
      <stop offset="70%" stop-color="#0284c7" stop-opacity="0" />
    </radialGradient>

    <!-- Logo Gradients -->
    <linearGradient id="teal-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf" />
      <stop offset="50%" stop-color="#14b8a6" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>

    <linearGradient id="bar-gradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>

    <!-- Bar Mask identical to FundSphere Brand Geometry -->
    <mask id="fs-banner-mask">
      <rect x="0" y="0" width="100" height="100" fill="white" />
      <path d="M 110 110 L 110 30 L 92.0 39.0 C 76 80, 48 83, 20.0 74.5 L -10 74.5 L -10 110 Z" fill="black" transform="translate(0, -1.8)" />
    </mask>

    <!-- Subtle Background Grid Pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.45" />
    </pattern>

    <filter id="subtle-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="20" />
    </filter>
  </defs>

  <!-- Container Box with Rounded Edges -->
  <rect width="1200" height="340" rx="20" fill="url(#bg-grad)" />
  <rect width="1200" height="340" rx="20" fill="url(#grid)" />

  <!-- Ambient Glow Spheres -->
  <circle cx="210" cy="170" r="190" fill="url(#teal-glow)" />
  <circle cx="980" cy="110" r="220" fill="url(#blue-glow)" />

  <!-- Container Border -->
  <rect x="0.75" y="0.75" width="1198.5" height="338.5" rx="19.25" fill="none" stroke="#134e4a" stroke-opacity="0.55" stroke-width="1.5" />

  <!-- ==================== BRAND EMBLEM ==================== -->
  <g transform="translate(85, 70) scale(2.0)">
    <!-- 1) Ascending Growth Bars with exact parallel offset bottoms -->
    <path d="M 24 73 L 24 64 Q 24 50 37 50 L 37 76.2 C 32 75.4 28 74.3 24 73 Z" fill="url(#bar-gradient)" />
    <path d="M 43 76.4 L 43 51 Q 43 36 56 36 L 56 74.2 C 51.5 75.7 47 76.3 43 76.4 Z" fill="url(#bar-gradient)" />
    <path d="M 62 71.5 L 62 36 Q 62 23 75 23 L 75 62.0 C 70.5 66.0 66 69.0 62 71.5 Z" fill="url(#bar-gradient)" />

    <!-- 2) Normal Circular Stroked Arc (100% Uniform Width, Zero Thinning) -->
    <path d="M 79.34 20.66 A 41.5 41.5 0 1 0 42.79 90.87"
          fill="none" stroke="url(#teal-accent)" stroke-width="3" stroke-linecap="round" />

    <!-- 3) Dynamic Crescent Swoosh -->
    <path d="M 12.76 71.50
             A 43 43 0 0 0 91.53 38.87
             C 74.0 80.0 46.0 85.0 15.36 70.00
             Z"
          fill="url(#teal-accent)" />

    <!-- 4) Precision Orbital Node Dot with Outer Sheen -->
    <circle cx="88.5" cy="31.0" r="4.5" fill="#5eead4" />
  </g>

  <!-- ==================== TYPOGRAPHY & HEADLINE ==================== -->
  <g transform="translate(340, 0)">
    <!-- Brand Title -->
    <text x="0" y="118" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-weight="900" font-size="64" letter-spacing="-1">
      <tspan fill="#14b8a6">Fund</tspan><tspan fill="#ffffff">Sphere</tspan>
    </text>

    <!-- Version / Status Pill -->
    <g transform="translate(390, 80)">
      <rect width="96" height="26" rx="13" fill="#0f766e" fill-opacity="0.35" stroke="#14b8a6" stroke-width="1" stroke-opacity="0.7" />
      <text x="48" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="12" font-weight="700" fill="#2dd4bf" text-anchor="middle">v2.0 • PROD</text>
    </g>

    <!-- Primary Tagline -->
    <text x="0" y="162" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="22" font-weight="600" fill="#f1f5f9" letter-spacing="-0.3">
      Intelligent Grant Discovery &amp; AI Proposal Compliance Engine
    </text>

    <!-- Secondary Description -->
    <text x="0" y="196" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="15" font-weight="400" fill="#94a3b8" letter-spacing="0.1">
      Hybrid Vector RAG (RRF) • 5-Signal Matching • RS256 Zero-Trust M2M • Gemini &amp; Groq Audit
    </text>

    <!-- Feature Badge Pills -->
    <g transform="translate(0, 230)">
      <!-- Pill 1 -->
      <g transform="translate(0, 0)">
        <rect width="138" height="34" rx="8" fill="#0f172a" fill-opacity="0.8" stroke="#0d9488" stroke-width="1" stroke-opacity="0.6" />
        <text x="69" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="12.5" font-weight="600" fill="#ccfbf1" text-anchor="middle">✦ Hybrid RRF</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(148, 0)">
        <rect width="148" height="34" rx="8" fill="#0f172a" fill-opacity="0.8" stroke="#0d9488" stroke-width="1" stroke-opacity="0.6" />
        <text x="74" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="12.5" font-weight="600" fill="#ccfbf1" text-anchor="middle">✦ 5-Signal Scoring</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(306, 0)">
        <rect width="144" height="34" rx="8" fill="#0f172a" fill-opacity="0.8" stroke="#0d9488" stroke-width="1" stroke-opacity="0.6" />
        <text x="72" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="12.5" font-weight="600" fill="#ccfbf1" text-anchor="middle">✦ RS256 Security</text>
      </g>
      <!-- Pill 4 -->
      <g transform="translate(460, 0)">
        <rect width="168" height="34" rx="8" fill="#0f172a" fill-opacity="0.8" stroke="#0d9488" stroke-width="1" stroke-opacity="0.6" />
        <text x="84" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="12.5" font-weight="600" fill="#ccfbf1" text-anchor="middle">✦ Gemini / Groq RAG</text>
      </g>
      <!-- Pill 5 -->
      <g transform="translate(638, 0)">
        <rect width="136" height="34" rx="8" fill="#0f172a" fill-opacity="0.8" stroke="#0d9488" stroke-width="1" stroke-opacity="0.6" />
        <text x="68" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="12.5" font-weight="600" fill="#ccfbf1" text-anchor="middle">✦ Delta Scraper</text>
      </g>
    </g>
  </g>
</svg>
