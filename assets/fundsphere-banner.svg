<svg viewBox="0 0 1200 340" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fs-banner-title fs-banner-desc">
  <title id="fs-banner-title">FundSphere</title>
  <desc id="fs-banner-desc">Research funding, from first search to final report: discover calls, prepare applications, review proposals and manage awarded grants.</desc>
  <defs>
    <!-- Background -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050a14" />
      <stop offset="50%" stop-color="#0b1528" />
      <stop offset="100%" stop-color="#041e24" />
    </linearGradient>

    <radialGradient id="teal-glow" cx="20%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0d9488" stop-opacity="0.32" />
      <stop offset="60%" stop-color="#0d9488" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#0d9488" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="blue-glow" cx="85%" cy="30%" r="45%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.22" />
      <stop offset="70%" stop-color="#0284c7" stop-opacity="0" />
    </radialGradient>

    <!-- Logo -->
    <linearGradient id="teal-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf" />
      <stop offset="50%" stop-color="#14b8a6" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>

    <linearGradient id="bar-gradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>

    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.45" />
    </pattern>
  </defs>

  <!-- Card -->
  <rect width="1200" height="340" rx="20" fill="url(#bg-grad)" />
  <rect width="1200" height="340" rx="20" fill="url(#grid)" />
  <circle cx="210" cy="170" r="190" fill="url(#teal-glow)" />
  <circle cx="980" cy="110" r="220" fill="url(#blue-glow)" />
  <rect x="0.75" y="0.75" width="1198.5" height="338.5" rx="19.25" fill="none" stroke="#134e4a" stroke-opacity="0.55" stroke-width="1.5" />

  <!-- Emblem: rising bars inside an orbit -->
  <g transform="translate(85, 70) scale(2.0)">
    <path d="M 24 73 L 24 64 Q 24 50 37 50 L 37 76.2 C 32 75.4 28 74.3 24 73 Z" fill="url(#bar-gradient)" />
    <path d="M 43 76.4 L 43 51 Q 43 36 56 36 L 56 74.2 C 51.5 75.7 47 76.3 43 76.4 Z" fill="url(#bar-gradient)" />
    <path d="M 62 71.5 L 62 36 Q 62 23 75 23 L 75 62.0 C 70.5 66.0 66 69.0 62 71.5 Z" fill="url(#bar-gradient)" />
    <path d="M 79.34 20.66 A 41.5 41.5 0 1 0 42.79 90.87" fill="none" stroke="url(#teal-accent)" stroke-width="3" stroke-linecap="round" />
    <path d="M 12.76 71.50 A 43 43 0 0 0 91.53 38.87 C 74.0 80.0 46.0 85.0 15.36 70.00 Z" fill="url(#teal-accent)" />
    <circle cx="88.5" cy="31.0" r="4.5" fill="#5eead4" />
  </g>

  <g transform="translate(340, 0)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Inter, 'Helvetica Neue', Arial, sans-serif">
    <!-- Name -->
    <text x="0" y="118" font-weight="900" font-size="64" letter-spacing="-1">
      <tspan fill="#14b8a6">Fund</tspan><tspan fill="#ffffff">Sphere</tspan>
    </text>

    <!-- Headline -->
    <text x="0" y="162" font-size="24" font-weight="600" fill="#f1f5f9" letter-spacing="-0.3">Research funding, from first search to final report</text>

    <!-- Who it's for -->
    <text x="0" y="194" font-size="15" fill="#94a3b8" letter-spacing="0.1">AI grant matching, guideline checklists, proposal review and grant compliance for researchers in India</text>

    <!-- The four stages -->
    <g transform="translate(0, 228)" font-size="14" font-weight="600">
      <g>
        <rect width="136" height="38" rx="19" fill="#0f172a" fill-opacity="0.85" stroke="#0d9488" stroke-opacity="0.65" />
        <circle cx="19" cy="19" r="12" fill="url(#teal-accent)" />
        <text x="19" y="23.5" font-size="12.5" font-weight="800" fill="#042f2e" text-anchor="middle">1</text>
        <text x="40" y="24" fill="#ccfbf1">Discover</text>
      </g>
      <path d="M 146 19 H 168 M 162 13 L 168 19 L 162 25" stroke="#2dd4bf" stroke-opacity="0.6" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" />
      <g transform="translate(178, 0)">
        <rect width="136" height="38" rx="19" fill="#0f172a" fill-opacity="0.85" stroke="#0d9488" stroke-opacity="0.65" />
        <circle cx="19" cy="19" r="12" fill="url(#teal-accent)" />
        <text x="19" y="23.5" font-size="12.5" font-weight="800" fill="#042f2e" text-anchor="middle">2</text>
        <text x="40" y="24" fill="#ccfbf1">Apply</text>
      </g>
      <path d="M 324 19 H 346 M 340 13 L 346 19 L 340 25" stroke="#2dd4bf" stroke-opacity="0.6" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" />
      <g transform="translate(356, 0)">
        <rect width="136" height="38" rx="19" fill="#0f172a" fill-opacity="0.85" stroke="#0d9488" stroke-opacity="0.65" />
        <circle cx="19" cy="19" r="12" fill="url(#teal-accent)" />
        <text x="19" y="23.5" font-size="12.5" font-weight="800" fill="#042f2e" text-anchor="middle">3</text>
        <text x="40" y="24" fill="#ccfbf1">Review</text>
      </g>
      <path d="M 502 19 H 524 M 518 13 L 524 19 L 518 25" stroke="#2dd4bf" stroke-opacity="0.6" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" />
      <g transform="translate(534, 0)">
        <rect width="136" height="38" rx="19" fill="#0f172a" fill-opacity="0.85" stroke="#0d9488" stroke-opacity="0.65" />
        <circle cx="19" cy="19" r="12" fill="url(#teal-accent)" />
        <text x="19" y="23.5" font-size="12.5" font-weight="800" fill="#042f2e" text-anchor="middle">4</text>
        <text x="40" y="24" fill="#ccfbf1">Manage</text>
      </g>
    </g>
  </g>
</svg>
